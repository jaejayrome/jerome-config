# =============================================================================
#                                 tmux.conf
# =============================================================================

# --- Prefix: Ctrl-a (easier than default Ctrl-b) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Colors / terminal ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color passthrough

# --- General behaviour ---
set -g mouse on
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # renumber when a window closes
set -g history-limit 50000
set -sg escape-time 10         # snappier ESC (better for nvim)
set -g focus-events on
set -g set-clipboard on

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Splits: | horizontal, - vertical (open in current path) ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation: prefix + hjkl (matches nvim) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing: prefix + HJKL (repeatable) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vi-style copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# =============================================================================
#                                 Statusline
# =============================================================================
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]  #S  "
set -g status-left-length 30
set -g status-right "#[fg=cyan]%a %d %b #[fg=white]%H:%M "
set -g window-status-current-format "#[fg=magenta,bold] #I:#W "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=magenta"
set -g pane-border-style "fg=brightblack"
